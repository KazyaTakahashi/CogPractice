name: Provision CogPractice AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      student_name:
        description: Name prefix for resources (example: kazya-takahashi)
        required: true
      created_date:
        description: Date tag in dd-mmm-yyyy format
        required: true
        default: 31-Jul-2026

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aws/terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Build Lambda artifact
        run: |
          cd ../..
          npm ci
          npm run build:lambda

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: |
          terraform apply -auto-approve \
            -var="student_name=${{ inputs.student_name }}" \
            -var="created_date=${{ inputs.created_date }}" \
            -var="mongodb_uri=${{ secrets.MONGODB_URI }}" \
            -var="jwt_access_secret=${{ secrets.JWT_ACCESS_SECRET }}" \
            -var="jwt_refresh_secret=${{ secrets.JWT_REFRESH_SECRET }}"

      - name: Show outputs
        run: terraform output
